<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a6b4a">
<title>倉庫存貨 — Demo Stock</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- 登入畫面：gate 模式未登入時只見呢版；readonly 模式未登入唔會嚟呢版，
     而係直接睇得、改唔得，㩒「入密碼先可以改」先嚟呢版 -->
<section id="login-view" class="login-view" hidden>
  <div class="login-card">
    <h1>倉庫存貨</h1>
    <p class="muted">Demo Stock · 入密碼先入得去</p>
    <form id="login-form">
      <label for="password">密碼</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="輸入密碼" required>
      <p id="login-error" class="error" hidden>密碼唔啱，再試過。</p>
      <button type="submit" class="btn primary block">入去</button>
    </form>
    <p class="muted small">登入一次之後 30 日內唔使再入密碼。</p>
  </div>
</section>

<!-- 主畫面 -->
<main id="app-view" hidden>
  <header class="topbar">
    <div>
      <h1>倉庫存貨</h1>
      <p id="status-line" class="muted small">載入緊…</p>
    </div>
    <div class="top-actions">
      <button id="edit-mode-btn" class="btn" hidden>入密碼先可以改</button>
      <button id="logout-btn" class="btn" hidden>登出</button>
    </div>
  </header>

  <section class="counts" id="counts" aria-label="總數">
    <div class="count"><strong id="count-total">–</strong><span>全部</span></div>
    <div class="count"><strong id="count-1f">–</strong><span>冷凍 1F</span></div>
    <div class="count"><strong id="count-2f">–</strong><span>冷凍 2F</span></div>
    <div class="count warn"><strong id="count-low">–</strong><span>低存量</span></div>
    <div class="count warn"><strong id="count-shelf">–</strong><span>補貨架</span></div>
  </section>

  <section class="controls">
    <div class="search-row">
      <input id="search" type="search" placeholder="搜尋：編號 / 中文 / 英文 / 條碼 / 包裝" autocomplete="off">
      <button id="scan-btn" class="btn" type="button">掃碼</button>
    </div>
    <div id="scanner" class="scanner" hidden>
      <video id="scanner-video" playsinline muted></video>
      <p class="muted small">將條碼對準相機；唔得就用下面影相 / 揀相。</p>
      <input id="scan-file" type="file" accept="image/*" capture="environment">
      <button id="scan-close" class="btn" type="button">收起掃碼</button>
    </div>
    <div class="filter-row" role="group" aria-label="儲存位置">
      <span class="filter-label">位置</span>
      <button class="chip active" data-filter-storage="all" type="button">全部</button>
      <button class="chip" data-filter-storage="1F" type="button">1F</button>
      <button class="chip" data-filter-storage="2F" type="button">2F</button>
      <button class="chip" data-filter-storage="unassigned" type="button">未定</button>
    </div>
    <div class="filter-row" role="group" aria-label="狀態">
      <span class="filter-label">狀態</span>
      <button class="chip active" data-filter-status="all" type="button">全部</button>
      <button class="chip" data-filter-status="low" type="button">低存量</button>
      <button class="chip" data-filter-status="shelf" type="button">補貨架</button>
    </div>
    <p class="muted small">兩個篩選一齊用（AND）：例如 1F + 補貨架。</p>
  </section>

  <nav class="tabs">
    <button id="tab-items" class="tab active" type="button">庫存</button>
    <button id="tab-movements" class="tab" type="button">出入記錄</button>
    <button id="add-btn" class="btn primary" type="button" hidden>＋ 加貨品</button>
  </nav>

  <p id="error-banner" class="error-banner" hidden></p>
  <p id="empty-state" class="muted" hidden>搵唔到符合嘅貨品。</p>

  <section id="items-list" class="items" aria-live="polite"></section>
  <section id="movements-list" class="movements" hidden aria-live="polite"></section>
</main>

<!-- 編輯 / 新增貨品 -->
<dialog id="item-dialog">
  <form id="item-form" method="dialog">
    <h2 id="item-dialog-title">加貨品</h2>
    <input type="hidden" id="f-code-current">
    <label>貨品編號 <span class="muted small">（留空會自動用下一個 TMP-xxx）</span>
      <input id="f-code" inputmode="numeric" autocomplete="off" placeholder="例如 1032555">
    </label>
    <label>中文名<input id="f-zh" autocomplete="off"></label>
    <label>英文名<input id="f-en" autocomplete="off"></label>
    <label>包裝 / 規格<input id="f-packing" autocomplete="off"></label>
    <label>條碼<input id="f-barcode" inputmode="numeric" autocomplete="off"></label>
    <label>來源貨單<input id="f-source" autocomplete="off"></label>
    <div class="form-row">
      <label>數量<input id="f-qty" type="number" step="any" min="0" inputmode="decimal"></label>
      <label>單位
        <select id="f-unit">
          <option value="">—</option>
          <option>Case</option><option>Pack</option><option>Box</option>
          <option>KG</option><option>個</option>
        </select>
      </label>
    </div>
    <div class="form-row">
      <label>儲存
        <select id="f-storage">
          <option>冷凍 1F</option><option>冷凍 2F</option><option>冷凍</option>
        </select>
      </label>
      <label>低存量提示<input id="f-low" type="number" step="any" min="0" inputmode="decimal"></label>
    </div>
    <label>貨架狀態
      <select id="f-shelf"><option value="ok">ok（有貨）</option><option value="補貨架">補貨架</option></select>
    </label>
    <label>備註<textarea id="f-remark" rows="2"></textarea></label>
    <p id="item-form-error" class="error" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="btn" id="item-cancel">取消</button>
      <button type="submit" class="btn primary">儲存</button>
    </div>
  </form>
</dialog>

<!-- 改數量 -->
<dialog id="qty-dialog">
  <form id="qty-form" method="dialog">
    <h2 id="qty-title">改數量</h2>
    <p id="qty-current" class="muted"></p>
    <div class="qty-stepper">
      <button type="button" class="btn" id="qty-minus">−1</button>
      <button type="button" class="btn" id="qty-plus">＋1</button>
    </div>
    <label>直接設定數量（盤點）
      <input id="qty-set" type="number" step="any" min="0" inputmode="decimal">
    </label>
    <label>備註<input id="qty-note" autocomplete="off" placeholder="例如 入貨 / 出貨原因"></label>
    <p id="qty-error" class="error" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="btn" id="qty-cancel">取消</button>
      <button type="submit" class="btn primary">儲存</button>
    </div>
  </form>
</dialog>

<!-- 改出入記錄 -->
<dialog id="movement-dialog">
  <form id="movement-form" method="dialog">
    <h2>改出入記錄</h2>
    <p id="mv-info" class="muted"></p>
    <input type="hidden" id="mv-id">
    <label>變動（正數入貨，負數出貨）<input id="mv-delta" type="number" step="any" inputmode="decimal" required></label>
    <label>種類
      <select id="mv-kind">
        <option value="in">in（入貨）</option><option value="out">out（出貨）</option>
        <option value="adjust">adjust（盤點調整）</option><option value="initial">initial（開倉）</option>
      </select>
    </label>
    <label>備註<input id="mv-note" autocomplete="off"></label>
    <p class="muted small">改咗變動，貨品數量會按差額自動調整；改到負數會被擋住。</p>
    <p id="mv-error" class="error" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="btn" id="mv-cancel">取消</button>
      <button type="submit" class="btn primary">儲存</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/dist/index.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
